name: Refresh job links

on:
  schedule:
    # Twice a day at odd minutes (GitHub delays on-the-hour crons by 1-2 h).
    # 10:37 UTC ≈ 4:37 AM Chicago, 22:41 UTC ≈ 4:41 PM Chicago (5:37 / 5:41 in summer)
    - cron: "37 10 * * *"
    - cron: "41 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data.json
        run: python3 scripts/refresh_jobs.py

      - name: Commit if changed
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json updates.json; then
            echo "No changes."
          else
            git add data.json updates.json
            git commit -m "chore: job refresh"
            git pull --rebase origin main
            git push
          fi
