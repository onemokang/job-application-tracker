name: Refresh job links

on:
  schedule:
    # 13:00 UTC ≈ 7-8am Chicago time, daily
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data.json
        run: python3 scripts/refresh_jobs.py

      - name: Commit if changed
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json updates.json; then
            echo "No changes."
          else
            git add data.json updates.json
            git commit -m "chore: daily job link refresh"
            git push
          fi
