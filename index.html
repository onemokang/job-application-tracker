<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Job Hunt — Onemo Kang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){var t=localStorage.getItem('trackerTheme_v1');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();
</script>
<link rel="stylesheet" href="styles.css?v=20261115b">
</head>
<body>

<div id="gate">
  <div class="card">
    <div style="font-size:30px">🔒</div>
    <h2>Private Tracker</h2>
    <p>Enter the password</p>
    <input id="gatePw" type="password" maxlength="12" autofocus placeholder="••••">
    <div id="gateErr"></div>
    <button id="gateBtn">Unlock</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Job Hunt</h1>
        <p id="goal"></p>
      </div>
      <div class="tools">
        <span class="chip go" id="countdown"></span>
        <button class="chip" id="sync"><span class="dot"></span>Loading…</button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>
    <div class="checked" id="checked"></div>

    <section id="banner" class="hide"></section>

    <nav class="tabs">
      <button data-tab="jobs" class="on">Jobs</button>
      <button data-tab="schools">Grad school</button>
      <button data-tab="prep">Prep map</button>
    </nav>

    <section id="tab-jobs">
      <div id="jobStats" class="filters"></div>
      <div class="filters">
        <div class="seg" id="fStyle">
          <button data-v="" class="on">All</button><button data-v="ai">AI</button><button data-v="mixed">Mixed</button><button data-v="leetcode">LeetCode</button>
        </div>
        <div class="seg" id="fStatus">
          <button data-v="" class="on">All</button><button data-v="Not Applied">To apply</button><button data-v="Applied">Applied</button>
        </div>
        <input class="search" id="q" placeholder="Search company or role">
      </div>
      <div id="jobList"></div>
      <div id="dropped" style="margin-top:14px"></div>
    </section>

    <section id="tab-schools" class="hide">
      <div class="note" id="schNote"></div>
      <div class="filters">
        <div class="seg" id="sKind">
          <button data-v="" class="on">All</button><button data-v="cs">CS</button><button data-v="swe">Software eng</button><button data-v="ds">Data sci</button>
        </div>
        <div class="seg" id="sStatus">
          <button data-v="" class="on">All</button><button data-v="Not Applied">To apply</button><button data-v="Applied">Applied</button>
        </div>
      </div>
      <div id="schList"></div>
    </section>

    <section id="tab-prep" class="hide">
      <div class="verdict" id="verdict"></div>
      <div class="verdict" id="prepStats"></div>
      <div class="verdict" id="rules"></div>
      <details class="note skipbox" id="skip"></details>
      <div id="map"></div>
    </section>
  </div>
  <button class="fab hide" id="fab">Jump to next ↓</button>
</div>
<div id="sheetRoot"></div>

<script src="config.js"></script>
<script src="sync.js?v=20261115b"></script>
<script src="app.js?v=20261115b"></script>
</body>
</html>
